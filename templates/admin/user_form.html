{% extends "admin/base_admin.html" %}

{% block admin_title %}{{ title }}{% endblock %}

{% block admin_content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6 sm:mb-8">
        <h1 class="text-2xl sm:text-3xl font-bold text-white mb-1">{{ title }}</h1>
        <p class="text-white/50 text-xs sm:text-sm">{% if mode == 'add' %}Create a new user account{% else %}Edit user details{% endif %}</p>
    </div>

    <div class="bg-[#1a1625] border border-white/5 p-4 sm:p-6 rounded-xl sm:rounded-2xl">
        <form method="POST">
            <div class="space-y-3 sm:space-y-4">
                <div>
                    <label class="block text-xs sm:text-sm font-medium text-white/70 mb-1">Full Name</label>
                    <input type="text" name="name" class="w-full bg-[#1a1625] border border-white/10 text-white rounded-lg px-3 sm:px-4 py-2 sm:py-3 outline-none focus:border-[#d4a94b] focus:shadow-[0_0_0_3px_rgba(212,169,75,0.2)] text-sm sm:text-base" value="{{ user.name if user else '' }}" required>
                </div>
                
                <div>
                    <label class="block text-xs sm:text-sm font-medium text-white/70 mb-1">Email Address</label>
                    <input type="email" name="email" class="w-full bg-[#1a1625] border border-white/10 text-white rounded-lg px-3 sm:px-4 py-2 sm:py-3 outline-none focus:border-[#d4a94b] focus:shadow-[0_0_0_3px_rgba(212,169,75,0.2)] text-sm sm:text-base" value="{{ user.email if user else '' }}" required>
                </div>
                
                <div>
                    <label class="block text-xs sm:text-sm font-medium text-white/70 mb-1">Password {% if mode == 'edit' %}(Leave blank to keep current){% endif %}</label>
                    <input type="password" name="password" class="w-full bg-[#1a1625] border border-white/10 text-white rounded-lg px-3 sm:px-4 py-2 sm:py-3 outline-none focus:border-[#d4a94b] focus:shadow-[0_0_0_3px_rgba(212,169,75,0.2)] text-sm sm:text-base" {% if mode == 'add' %}required{% endif %} minlength="6">
                    {% if mode == 'add' %}<p class="text-[10px] sm:text-xs text-white/30 mt-1">Minimum 6 characters</p>{% endif %}
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                    <div>
                        <label class="block text-xs sm:text-sm font-medium text-white/70 mb-1">Role</label>
                        <select name="role" class="w-full bg-[#1a1625] border border-white/10 text-white rounded-lg px-3 sm:px-4 py-2 sm:py-3 outline-none focus:border-[#d4a94b] focus:shadow-[0_0_0_3px_rgba(212,169,75,0.2)] text-sm sm:text-base">
                            <option value="Customer" {% if user and user.role == 'Customer' %}selected{% endif %}>Customer</option>
                            <option value="Admin" {% if user and user.role == 'Admin' %}selected{% endif %}>Admin</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs sm:text-sm font-medium text-white/70 mb-1">Status</label>
                        <select name="status" class="w-full bg-[#1a1625] border border-white/10 text-white rounded-lg px-3 sm:px-4 py-2 sm:py-3 outline-none focus:border-[#d4a94b] focus:shadow-[0_0_0_3px_rgba(212,169,75,0.2)] text-sm sm:text-base">
                            <option value="Active" {% if user and user.status == 'Active' %}selected{% endif %}>Active</option>
                            <option value="Inactive" {% if user and user.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 mt-6 pt-6 border-t border-white/5">
                <button type="submit" class="btn-primary px-6 sm:px-8 py-2.5 sm:py-3 rounded-lg text-sm sm:text-base flex items-center justify-center gap-2 w-full sm:w-auto">
                    {% if mode == 'add' %}<i class="fas fa-user-plus"></i>Create User{% else %}<i class="fas fa-save"></i>Update User{% endif %}
                </button>
                <a href="{{ url_for('admin_users') }}" class="bg-white/10 hover:bg-white/20 text-white px-6 sm:px-8 py-2.5 sm:py-3 rounded-lg transition text-center text-sm sm:text-base flex items-center justify-center gap-2 w-full sm:w-auto">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
