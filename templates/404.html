{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-300px)] flex items-center justify-center px-3 sm:px-4 py-8 sm:py-12">
    <div class="max-w-lg w-full text-center p-6 sm:p-8 bg-[#1a1625]/50 backdrop-blur-lg rounded-2xl sm:rounded-3xl border border-white/5 animate-[fadeInUp_0.6s_ease-out]">
        <i class="fas fa-compass text-4xl sm:text-5xl text-[#d4a94b] opacity-20 mb-2 block"></i>
        <div class="text-7xl sm:text-8xl lg:text-9xl font-extrabold leading-none bg-gradient-to-r from-[#d4a94b] to-[#f5d98e] bg-clip-text text-transparent mb-4">404</div>
        <div class="w-16 h-0.5 mx-auto my-6 bg-gradient-to-r from-transparent via-[#d4a94b]/50 to-transparent"></div>
        <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-white mb-3">Page Not Found</h1>
        <p class="text-white/50 text-sm sm:text-base mb-6 leading-relaxed">The page you're looking for doesn't exist or has been moved.</p>
        
        <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 items-center justify-center">
            <a href="{{ url_for('index') }}" class="btn-primary px-6 sm:px-10 py-3 rounded-xl flex items-center gap-2 text-sm sm:text-base w-full sm:w-auto justify-center">
                <i class="fas fa-home"></i> Go Home
            </a>
            <a href="{{ url_for('store') }}" class="bg-white/5 border border-white/10 text-white/70 hover:bg-white/10 hover:text-white px-6 sm:px-8 py-3 rounded-xl flex items-center gap-2 text-sm sm:text-base w-full sm:w-auto justify-center transition">
                <i class="fas fa-shopping-bag"></i> Browse Store
            </a>
        </div>
        
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-6 max-w-xs mx-auto">
            <a href="{{ url_for('about') }}" class="text-white/30 text-xs sm:text-sm px-2 py-1.5 rounded-lg bg-white/5 border border-white/5 hover:text-[#d4a94b] hover:bg-[#d4a94b]/5 transition text-center">About</a>
            <a href="{{ url_for('contact') }}" class="text-white/30 text-xs sm:text-sm px-2 py-1.5 rounded-lg bg-white/5 border border-white/5 hover:text-[#d4a94b] hover:bg-[#d4a94b]/5 transition text-center">Contact</a>
            <a href="{{ url_for('cart') }}" class="text-white/30 text-xs sm:text-sm px-2 py-1.5 rounded-lg bg-white/5 border border-white/5 hover:text-[#d4a94b] hover:bg-[#d4a94b]/5 transition text-center">Cart</a>
            <a href="{{ url_for('profile') }}" class="text-white/30 text-xs sm:text-sm px-2 py-1.5 rounded-lg bg-white/5 border border-white/5 hover:text-[#d4a94b] hover:bg-[#d4a94b]/5 transition text-center">Profile</a>
        </div>
    </div>
</div>
{% endblock %}
