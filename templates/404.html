{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-32 text-center">
    <div class="text-6xl font-bold text-[#d4a94b] mb-6">404</div>
    <h1 class="text-3xl font-bold mb-4">Page Not Found</h1>
    <p class="text-white/50 mb-8">The page you're looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('index') }}" class="btn-primary px-8 py-3 rounded-lg inline-block">Go Home</a>
</div>
{% endblock %}
